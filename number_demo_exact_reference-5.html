<meta charset="UTF-8">

<title>Number Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#111;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start}
#screen{position:relative;width:min(100vw,691px);aspect-ratio:691/1536;background:#fff;overflow:hidden}
#reference{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#exit{left:3.7%;top:6.1%;width:11.5%;height:5.5%}
#auto{left:49.5%;top:6.3%;width:16.5%;height:4.1%}
#historyBtn{left:76%;top:6.0%;width:21%;height:5.5%}
#speed3{left:27%;top:12.8%;width:8.2%;height:3.8%}
#speed4{left:36.8%;top:12.8%;width:8.2%;height:3.8%}
#speed5{left:46.2%;top:12.8%;width:8.2%;height:3.8%}
#speed6{left:55.8%;top:12.8%;width:8.2%;height:3.8%}
#speed7{left:65.4%;top:12.8%;width:8.2%;height:3.8%}
#speaker{left:6.1%;top:26.0%;width:12%;height:5.3%}
#play{left:22.6%;top:32.5%;width:55%;height:9.5%}
#result{position:absolute;left:25%;top:18.5%;width:50%;height:12%;display:flex;align-items:center;justify-content:center;color:#222;font-size:clamp(100px,32vw,220px);line-height:1;font-weight:400;pointer-events:none}
#prev{position:absolute;left:4.3%;top:18.7%;width:18%;height:3%;display:flex;align-items:center;color:#333;font-size:clamp(18px,4.5vw,30px);font-weight:700;pointer-events:none}
#grid{position:absolute;left:7.4%;top:44.5%;width:85.3%;height:34.5%;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(9,1fr)}
.cell{border:0;background:transparent;color:transparent;font-size:clamp(12px,4vw,25px);display:flex;align-items:center;justify-content:center;padding:0}
.cell.selected{color:#fff;background:#d71920;outline:2px solid #d71920;outline-offset:-3px}
#historyRail{position:absolute;z-index:5;left:1%;top:5%;width:23%;height:84%;overflow-y:auto;overflow-x:hidden;background:rgba(150,150,150,.48);display:none;flex-direction:column;align-items:center;gap:1.3%;padding-top:5.5%;pointer-events:auto}
.railNumber{width:min(15vw,88px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 42% 35%,#fff 0 42%,#e8e8e8 44% 53%,#238b35 56% 72%,#0b5e20 75% 100%);border:5px solid #28963b;box-shadow:inset 0 0 4px #555,0 2px 4px #777;color:#111;font-weight:bold;font-size:clamp(20px,6vw,42px);text-shadow:0 1px white}
.railNumber:nth-child(even){background:radial-gradient(circle at 42% 35%,#fff 0 42%,#e8e8e8 44% 53%,#1879c7 56% 72%,#064d94 75% 100%);border-color:#1475c2}
@media(min-width:692px){#screen{width:691px}}
</style>

<button class="hit" id="exit" aria-label="Reset demo"></button>
<button class="hit" id="auto" aria-label="Toggle auto"></button>
<div id="autoState">OFF</div>
<button class="hit" id="historyBtn" aria-label="Number history"></button>
<button class="hit" id="speed3" aria-label="Speed 3"></button>
<button class="hit" id="speed4" aria-label="Speed 4"></button>
<button class="hit" id="speed5" aria-label="Speed 5"></button>
<button class="hit" id="speed6" aria-label="Speed 6"></button>
<button class="hit" id="speed7" aria-label="Speed 7"></button>
<div id="speedMark"></div>
<button class="hit" id="speaker" aria-label="Toggle sound"></button>
<div id="soundState">🔇</div>
<div id="prev"></div>
<div id="result"></div>
<button class="hit" id="play" aria-label="Play random number"></button>
<div id="grid"></div>
<div id="historyRail" aria-label="Recent number history"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let numbers=[],current=null,previous=null,autoOn=true,soundOn=true,selectedSpeed=4;
for(let n=1;n<=90;n++){
  const b=document.createElement('button');
  b.className='cell'; b.type='button'; b.textContent=n; b.setAttribute('aria-label','Number '+n);
  b.addEventListener('click',()=>{});
  $('grid').appendChild(b);
}
function markSpeed(s){
 selectedSpeed=s;
 const left={3:27,4:36.8,5:46.2,6:55.8,7:65.4}[s];
 $('speedMark').style.left=left+'%'; $('speedMark').style.display='block';
}
[3,4,5,6,7].forEach(s=>$('speed'+s).addEventListener('click',()=>markSpeed(s)));
$('auto').addEventListener('click',()=>{
 autoOn=!autoOn;
 $('autoState').style.display=autoOn?'none':'flex';
});
$('speaker').addEventListener('click',()=>{
 soundOn=!soundOn;
 $('soundState').style.display=soundOn?'none':'flex';
});
function renderRail(){
 const rail=$('historyRail');
 rail.innerHTML='';
 numbers.forEach(n=>{
  const item=document.createElement('div');
  item.className='railNumber';
  item.textContent=n;
  rail.appendChild(item);
 });
}
function play(){
 let pool=Array.from({length:90},(_,i)=>i+1).filter(n=>!numbers.slice(0,90).includes(n));
 if(!pool.length){pool=Array.from({length:90},(_,i)=>i+1);}
 const n=pool[Math.floor(Math.random()*pool.length)];
 previous=current; current=n; numbers.unshift(n); renderHistoryRail();
 $('prev').textContent=previous===null?'--':previous;
 $('result').textContent=String(n);
 document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('selected',numbers.includes(Number(c.textContent))));
 if(soundOn){
  try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=600;g.gain.value=.06;o.start();o.stop(ctx.currentTime+.12);o.onended=()=>ctx.close();}catch(e){}
 }
}
$('play').addEventListener('click',play);
function renderHistoryRail(){
 const rail=$('historyRail');
 rail.innerHTML='';
 numbers.forEach(n=>{
  const badge=document.createElement('div');
  badge.className='railNumber';
  badge.textContent=n;
  rail.appendChild(badge);
 });
}
$('historyBtn').addEventListener('click',()=>{
 const rail=$('historyRail');
 const opening=rail.style.display!=='flex';
 if(opening) renderHistoryRail();
 rail.style.display=opening?'flex':'none';
});
$('exit').addEventListener('click',()=>{
 numbers=[];current=null;previous=null;renderHistoryRail();
 $('prev').textContent='';$('result').textContent='';
 document.querySelectorAll('.cell').forEach(c=>c.classList.remove('selected'));
 $('historyRail').style.display='none';
});
</script>
